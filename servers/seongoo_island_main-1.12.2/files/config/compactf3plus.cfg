# Configuration file

##########################################################################################################
# hud sections
#--------------------------------------------------------------------------------------------------------#
# Toggle which lines and sections are visible on the HUD.
##########################################################################################################

"hud sections" {
    # Show detailed speed information [default: false]
    B:"Detailed Speed"=false

    # Show biome line [default: true]
    B:"Show Biome"=true

    # Show chunk/slime info line [default: false]
    B:"Show Chunk/Slime"=false

    # Show XYZ coordinates line [default: true]
    B:"Show Coordinates"=true

    # Show in-game day line [default: true]
    B:"Show Day"=true

    # Show dimension line [default: false]
    B:"Show Dimension"=false

    # Show entities count line [default: false]
    B:"Show Entities Count"=false

    # Show FPS line [default: true]
    B:"Show FPS"=true

    # Show facing direction line [default: true]
    B:"Show Facing"=true

    # Show Lag (Stutters) line [default: true]
    B:"Show Lag"=true

    # Show light level line [default: true]
    B:"Show Light"=true

    # Show local difficulty line [default: false]
    B:"Show Local Difficulty"=false

    # Show ping line [default: true]
    B:"Show Ping"=true

    # Show head pitch (vertical angle) line [default: false]
    B:"Show Pitch"=false

    # Show RAM line [default: true]
    B:"Show RAM"=true

    # Show session time line [default: true]
    B:"Show Session"=true

    # Show speed section [default: true]
    B:"Show Speed"=true

    # Show TPS line [default: false]
    B:"Show TPS"=false

    # Show in-game time line [default: true]
    B:"Show Time"=true
}


##########################################################################################################
# visuals
#--------------------------------------------------------------------------------------------------------#
# Visual settings for the HUD.
##########################################################################################################

visuals {
    # Background opacity percentage (0-100) [range: 0 ~ 100, default: 25]
    I:"Background Opacity"=25

    # Color-code FPS and TPS values [default: false]
    B:"Color Indicators"=false

    # Enable HUD by default [default: false]
    B:"Enabled by Default"=false

    # Replace the default F3 debug screen [default: true]
    B:"Replace Default F3"=true

    # Show the XYZ axis gizmo when F3 is replaced [default: false]
    B:"Show Gizmo"=false

    # Render text with shadow [default: false]
    B:"Text Shadow"=false
}


